<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Health Monitoring System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-paw"></i> Puppy Health Tracker</h1>
        <nav>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search puppies...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <button id="add-puppy-btn">Add Puppy</button>
        </nav>
    </header>

    <main id="app">
        <section id="puppy-list-section">
            <h2>Our Puppies</h2>
            <div id="puppy-list" class="puppy-grid"></div>
        </section>

        <section id="puppy-detail-section" class="hidden">
            <button id="back-to-list">Back to List</button>
            <div id="puppy-detail-content"></div>
        </section>
    </main>

    <!-- Puppy Modal -->
    <div id="puppy-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Add New Puppy</h2>
            <form id="puppy-form">
                <input type="hidden" id="puppy-id">
                <div class="form-group"><label>Name:</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Breed:</label><input type="text" id="breed"></div>
                <div class="form-group"><label>Gender:</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
                <div class="form-group"><label>Birth Date:</label><input type="date" id="birth_date"></div>
                <div class="form-group"><label>Weight (kg):</label><input type="number" step="0.1" id="weight"></div>
                <div class="form-group"><label>Color:</label><input type="text" id="color"></div>
                <button type="submit" class="btn btn-primary">Save Puppy</button>
            </form>
        </div>
    </div>

    <!-- Health Modal -->
    <div id="health-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="health-modal-title">Add Health Record</h2>
            <form id="health-form">
                <input type="hidden" id="health-puppy-id">
                <input type="hidden" id="health-id">
                <div class="form-group"><label>Temperature (°C):</label><input type="number" step="0.1" id="temperature"></div>
                <div class="form-group"><label>Heart Rate (bpm):</label><input type="number" id="heart_rate"></div>
                <div class="form-group"><label>Symptoms:</label><input type="text" id="symptoms"></div>
                <div class="form-group"><label>Diagnosis:</label><input type="text" id="diagnosis"></div>
                <div class="form-group"><label>Notes:</label><textarea id="health-notes"></textarea></div>
                <button type="submit" class="btn btn-primary">Save Record</button>
            </form>
        </div>
    </div>

    <!-- Vaccination Modal -->
    <div id="vaccination-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="vacc-modal-title">Add Vaccination</h2>
            <form id="vaccination-form">
                <input type="hidden" id="vacc-puppy-id">
                <input type="hidden" id="vacc-id">
                <div class="form-group"><label>Vaccine Name:</label><input type="text" id="vaccine_name" required></div>
                <div class="form-group"><label>Date Administered:</label><input type="date" id="date_administered" required></div>
                <div class="form-group"><label>Next Due Date:</label><input type="date" id="next_due_date"></div>
                <button type="submit" class="btn btn-primary">Save Vaccination</button>
            </form>
        </div>
    </div>

    <!-- Growth Modal -->
    <div id="growth-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="growth-modal-title">Track Growth</h2>
            <form id="growth-form">
                <input type="hidden" id="growth-puppy-id">
                <input type="hidden" id="growth-id">
                <div class="form-group"><label>Weight (kg):</label><input type="number" step="0.1" id="growth-weight" required></div>
                <div class="form-group"><label>Height (cm):</label><input type="number" step="0.1" id="growth-height"></div>
                <button type="submit" class="btn btn-primary">Save Growth</button>
            </form>
        </div>
    </div>

    <!-- Medication Modal -->
    <div id="medication-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="med-modal-title">Add Medication</h2>
            <form id="medication-form">
                <input type="hidden" id="med-puppy-id">
                <input type="hidden" id="med-id">
                <div class="form-group"><label>Medicine Name:</label><input type="text" id="medicine_name" required></div>
                <div class="form-group"><label>Dosage:</label><input type="text" id="dosage"></div>
                <div class="form-group"><label>Start Date:</label><input type="date" id="start_date"></div>
                <div class="form-group"><label>End Date:</label><input type="date" id="end_date"></div>
                <div class="form-group"><label>Instructions:</label><textarea id="med-instructions"></textarea></div>
                <button type="submit" class="btn btn-primary">Save Medication</button>
            </form>
        </div>
    </div>

    <!-- Vet Visit Modal -->
    <div id="vet-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="vet-modal-title">Add Vet Visit</h2>
            <form id="vet-form">
                <input type="hidden" id="vet-visit-puppy-id">
                <input type="hidden" id="vet-id">
                <div class="form-group"><label>Visit Date:</label><input type="date" id="visit_date" required></div>
                <div class="form-group"><label>Reason:</label><input type="text" id="visit_reason"></div>
                <div class="form-group"><label>Treatment:</label><input type="text" id="visit_treatment"></div>
                <div class="form-group"><label>Notes:</label><textarea id="visit-notes"></textarea></div>
                <button type="submit" class="btn btn-primary">Save Visit</button>
            </form>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Add Alert</h2>
            <form id="alert-form">
                <input type="hidden" id="alert-puppy-id">
                <div class="form-group"><label>Type:</label><select id="alert-type"><option value="Health">Health</option><option value="Vaccination">Vaccination</option><option value="Medication">Medication</option><option value="Other">Other</option></select></div>
                <div class="form-group"><label>Message:</label><textarea id="alert-message" required></textarea></div>
                <button type="submit" class="btn btn-primary">Save Alert</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
